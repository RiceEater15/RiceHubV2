<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IPA Signer Embed</title>
<style>
  body, html { margin:0; padding:0; height:100%; display:flex; justify-content:center; align-items:center; background:#f0f0f0; }
  .iframe-container {
    width: 600px;  /* width of the signer area */
    height: 700px; /* height of the signer area */
    overflow: hidden;
    border-radius: 12px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.2);
  }
  .iframe-container iframe {
    border:none;
    width: 100%;
    height: 1200px; /* bigger than container */
    transform: translateY(-250px); /* crop top to show only signer */
  }
</style>
</head>
<body>

<div class="iframe-container">
  <iframe src="https://applejr.cloud"></iframe>
</div>

</body>
</html>
