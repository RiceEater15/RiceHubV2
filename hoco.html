<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rock That Body - Timed Typing Lyrics</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    font-family: "Poppins", sans-serif;
    color: #000;
    text-align: center;
    overflow: hidden;
    background-color: white;
    transition: background-color 0.05s ease;
  }

  #lyrics {
    font-size: 2em;
    min-height: 3em;
    display: flex;
    align-items: center;
    justify-content: center;
    white-space: pre-wrap;
  }

  button {
    margin-top: 30px;
    padding: 12px 28px;
    font-size: 1.2em;
    border: none;
    border-radius: 30px;
    background: linear-gradient(45deg,#ff0080,#00e5ff);
    color: #fff;
    cursor: pointer;
    box-shadow: 0 0 20px #ff00ff80;
    transition: transform 0.3s, box-shadow 0.3s;
  }

  button:hover {
    transform: scale(1.1);
    box-shadow: 0 0 30px #00f5ff;
  }
</style>
</head>
<body>

<div id="lyrics">“Rock That Body” — Black Eyed Peas</div>
<button id="startBtn">🎸 Rock n Roll</button>

<script>
// Lyrics array with custom timings in seconds
const lines = [
  { text: "I wanna da-", time: 0.06 },
  { text: "I wanna dance in the lights", time: 0.05 },
  { text: "I wanna ro-", time: 8.07 },
  { text: "I wanna rock your body", time: 6.08 },
  { text: "I wanna go", time: 0.08 },
  { text: "I wanna go for a ride", time: 0.068 },
  { text: "Hop in the music and", time: 0.07 },
  { text: "Rock your body", time: 6.08 },
  { text: "Rock that body", time: 0.069 },
  { text: "come on, come on", time: 0.035 },
  { text: "Rock that body", time: 8.05 },
  { text: "(Rock your body)", time: 0.03 },
  { text: "Rock that body", time: 0.049 },
  { text: "come on, come on", time: 0.035 },
  { text: "Rock that body", time: 8.68 },
];

const lyricDiv = document.getElementById("lyrics");
const btn = document.getElementById("startBtn");

function typeLine(line) {
  return new Promise(resolve => {
    const words = line.text.split(" ");
    let i = 0;
    function nextWord() {
      if (i < words.length) {
        lyricDiv.textContent += (i === 0 ? "" : " ") + words[i];
        // Flash background white->gray for each word
        document.body.style.backgroundColor = "#ccc";
        setTimeout(() => { document.body.style.backgroundColor = "white"; }, 50);
        i++;
        setTimeout(nextWord, 150); // typing speed per word
      } else {
        resolve();
      }
    }
    nextWord();
  });
}

async function playLyrics() {
  btn.style.display = "none";
  lyricDiv.textContent = "";
  for (let line of lines) {
    await new Promise(r => setTimeout(r, line.time * 1000)); // wait line.time seconds
    await typeLine(line);
    lyricDiv.textContent += "\n"; // new line after each lyric
  }
  lyricDiv.textContent += "\n🎶 The End 🎶";
  btn.style.display = "block";
}

btn.addEventListener("click", playLyrics);
</script>
</body>
</html>
