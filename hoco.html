<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lyric Animation</title>
<style>
  body {
    background: linear-gradient(135deg, #0b0b2a, #1a0033);
    color: white;
    font-family: "Poppins", sans-serif;
    text-align: center;
    overflow: hidden;
    height: 100vh;
    margin: 0;
  }
  h1 {
    margin-top: 40px;
    color: #ff66cc;
    text-shadow: 0 0 20px #ff66cc;
  }
  #lyrics {
    font-size: 2em;
    margin-top: 25vh;
    opacity: 0;
    transition: opacity 0.5s, transform 0.5s;
  }
  #lyrics.show {
    opacity: 1;
    transform: scale(1.1);
    text-shadow: 0 0 20px #ff99ff, 0 0 40px #00ccff;
  }
  audio {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
  }
</style>
</head>
<body>
  <h1>🎶 Lyric Animation Demo 🎶</h1>
  <div id="lyrics">Press play to start</div>

  <audio id="song" controls>
    <!-- Replace with your own MP3 URL or upload path -->
    <source src="song.mp3" type="audio/mpeg">
  </audio>

<script>
const lyrics = [
  { time: 2, text: "Don't be so quick to walk away" },
  { time: 7, text: "Dance with me" },
  { time: 11, text: "I wanna rock your body" },
  { time: 16, text: "Please stay" },
  { time: 21, text: "Dance with me 🎵" }
];

const audio = document.getElementById('song');
const lyricBox = document.getElementById('lyrics');

let index = 0;

audio.addEventListener('timeupdate', () => {
  if (index < lyrics.length && audio.currentTime >= lyrics[index].time) {
    lyricBox.textContent = lyrics[index].text;
    lyricBox.classList.add('show');
    setTimeout(() => lyricBox.classList.remove('show'), 1800);
    index++;
  }
});

audio.addEventListener('ended', () => {
  index = 0;
  lyricBox.textContent = "Song ended 🎧";
});
</script>
</body>
</html>
