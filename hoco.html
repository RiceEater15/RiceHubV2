<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rock That Body - Lyric Animation</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: radial-gradient(circle at center, #000010, #000);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    color: #fff;
    font-family: "Poppins", sans-serif;
    overflow: hidden;
    text-align: center;
  }

  #lyrics {
    font-size: 2.2em;
    text-shadow: 0 0 12px #00f5ff, 0 0 25px #ff00ff;
    opacity: 0;
    transform: scale(0.9);
    transition: opacity 0.6s ease, transform 0.6s ease;
    min-height: 2.5em; /* keeps the text area fixed height so layout doesn’t jump */
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .show {
    opacity: 1;
    transform: scale(1);
  }

  @keyframes bgPulse {
    0%, 100% { background-color: #000010; }
    50% { background-color: #220033; }
  }

  body.animate {
    animation: bgPulse 2s infinite;
  }

  button {
    margin-top: 40px;
    background: linear-gradient(45deg, #ff0080, #00e5ff);
    border: none;
    border-radius: 30px;
    color: #fff;
    font-size: 1.2em;
    padding: 12px 28px;
    cursor: pointer;
    text-transform: uppercase;
    letter-spacing: 2px;
    box-shadow: 0 0 20px #ff00ff80;
    transition: transform 0.3s ease, box-shadow 0.3s ease;
  }

  button:hover {
    transform: scale(1.1);
    box-shadow: 0 0 30px #00f5ff;
  }

  .start {
    position: absolute;
    bottom: 25px;
    font-size: 0.9em;
    color: #aaa;
  }
</style>
</head>
<body>
  <div id="lyrics">“Rock That Body” — Black Eyed Peas</div>
  <button id="startBtn">🎸 Rock n Roll</button>
  <div class="start">Tap the button to start lyric animation</div>

<script>
const lines = [
  { text: "I wanna, I wanna rock right now", time: 1000 },
  { text: "I wanna, I wanna rock right now", time: 3500 },
  { text: "I wanna, I wanna rock right now", time: 6000 },
  { text: "I wanna da-, I wanna dance in the lights", time: 9000 },
  { text: "I wanna ro-, I wanna rock your body", time: 12500 },
  { text: "I wanna go, I wanna go for a ride", time: 15500 },
  { text: "Hop in the music and rock your body right", time: 18500 },
  { text: "Rock that body, come on, come on, rock that body (rock your body)", time: 22000 },
  { text: "Rock that body, come on, come on, rock that body", time: 25000 },
  { text: "Rock that body, come on, come on, rock that body (rock your body)", time: 28000 },
  { text: "Rock that body, come on, come on, rock that body", time: 31000 },
];

const lyricDiv = document.getElementById("lyrics");
const btn = document.getElementById("startBtn");
let started = false;

function playLyrics() {
  if (started) return;
  started = true;
  btn.style.display = "none";
  document.body.classList.add("animate");
  lyricDiv.textContent = "";

  // Ensure visibility works smoothly on iPad
  lines.forEach((line) => {
    setTimeout(() => {
      lyricDiv.classList.remove("show");
      // Force reflow fix for Safari animations
      void lyricDiv.offsetWidth;
      setTimeout(() => {
        lyricDiv.textContent = line.text;
        lyricDiv.classList.add("show");
      }, 100);
    }, line.time);
  });

  setTimeout(() => {
    lyricDiv.textContent = "🎶 The End 🎶";
    document.body.classList.remove("animate");
    btn.style.display = "block";
    started = false;
  }, lines[lines.length - 1].time + 4000);
}

btn.addEventListener("click", playLyrics);
</script>
</body>
</html>
