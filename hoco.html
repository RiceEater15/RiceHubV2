<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rock That Body - Flashing Typing Lyrics</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    font-family: "Poppins", sans-serif;
    color: #fff;
    text-align: center;
    overflow: hidden;
    background-color: black;
    transition: background-color 0.05s ease;
  }

  #lyrics {
    font-size: 2em;
    min-height: 3em;
    display: flex;
    align-items: center;
    justify-content: center;
    white-space: pre-wrap;
  }

  button {
    margin-top: 30px;
    padding: 12px 28px;
    font-size: 1.2em;
    border: none;
    border-radius: 30px;
    background: linear-gradient(45deg,#ff0080,#00e5ff);
    color: #fff;
    cursor: pointer;
    box-shadow: 0 0 20px #ff00ff80;
    transition: transform 0.3s, box-shadow 0.3s;
  }

  button:hover {
    transform: scale(1.1);
    box-shadow: 0 0 30px #00f5ff;
  }
</style>
</head>
<body>
<div id="lyrics">“Rock That Body” — Black Eyed Peas</div>
<button id="startBtn">🎸 Rock n Roll</button>

<script>
const lyrics = [
  // Removed first 2 lines
  { text: "I wanna, I wanna rock right now", time: 0 },
  { text: "I wanna da-, I wanna dance in the lights", time: 3000 },
  { text: "I wanna ro-, I wanna rock your body", time: 6000 },
  { text: "I wanna go, I wanna go for a ride", time: 9000 },
  { text: "Hop in the music and rock your body right", time: 12000 },
  { text: "Rock that body, come on, come on, rock that body (rock your body)", time: 15000 },
  { text: "Rock that body, come on, come on, rock that body", time: 18000 },
  { text: "Rock that body, come on, come on, rock that body (rock your body)", time: 21000 },
  { text: "Rock that body, come on, come on, rock that body", time: 24000 },
];

const lyricDiv = document.getElementById("lyrics");
const btn = document.getElementById("startBtn");

function flashBackground() {
  document.body.style.backgroundColor = "white";
  setTimeout(() => {
    document.body.style.backgroundColor = "black";
  }, 50);
}

function typeWordByWord(text, callback) {
  const words = text.split(" ");
  let i = 0;
  function nextWord() {
    if (i < words.length) {
      lyricDiv.textContent += (i === 0 ? "" : " ") + words[i];
      flashBackground(); // flash bg every word
      i++;
      setTimeout(nextWord, 250); // speed per word
    } else if (callback) {
      callback();
    }
  }
  nextWord();
}

function playLyrics() {
  btn.style.display = "none";
  lyricDiv.textContent = "";
  lyrics.forEach((line) => {
    setTimeout(() => {
      lyricDiv.textContent = "";
      typeWordByWord(line.text);
    }, line.time);
  });

  setTimeout(() => {
    lyricDiv.textContent = "🎶 The End 🎶";
    btn.style.display = "block";
  }, lyrics[lyrics.length - 1].time + 5000);
}

btn.addEventListener("click", playLyrics);
</script>
</body>
</html>
