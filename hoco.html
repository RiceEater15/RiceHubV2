<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rock That Body - Lyrics</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: radial-gradient(circle at center, #000010, #000);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    font-family: "Poppins", sans-serif;
    color: #fff;
    text-align: center;
    overflow: hidden;
  }

  #lyrics {
    font-size: 2em;
    min-height: 3em;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 1; /* start visible so Safari renders it */
    transition: opacity 0.5s ease, transform 0.5s ease;
    transform: scale(0.9);
  }

  .show {
    transform: scale(1);
    opacity: 1;
  }

  @keyframes bgPulse {
    0%, 100% { background-color: #000010; }
    50% { background-color: #220033; }
  }

  body.animate {
    animation: bgPulse 2s infinite;
  }

  button {
    margin-top: 30px;
    padding: 12px 28px;
    font-size: 1.2em;
    border: none;
    border-radius: 30px;
    background: linear-gradient(45deg,#ff0080,#00e5ff);
    color: #fff;
    cursor: pointer;
    box-shadow: 0 0 20px #ff00ff80;
    transition: transform 0.3s, box-shadow 0.3s;
  }

  button:hover {
    transform: scale(1.1);
    box-shadow: 0 0 30px #00f5ff;
  }

  .start {
    position: absolute;
    bottom: 25px;
    color: #aaa;
    font-size: 0.9em;
  }
</style>
</head>
<body>
  <div id="lyrics">“Rock That Body” — Black Eyed Peas</div>
  <button id="startBtn">🎸 Rock n Roll</button>
  <div class="start">Tap the button to start lyric animation</div>

<script>
const lyrics = [
  { text: "I wanna, I wanna rock right now", time: 0 },
  { text: "I wanna, I wanna rock right now", time: 3000 },
  { text: "I wanna, I wanna rock right now", time: 6000 },
  { text: "I wanna da-, I wanna dance in the lights", time: 9000 },
  { text: "I wanna ro-, I wanna rock your body", time: 12000 },
  { text: "I wanna go, I wanna go for a ride", time: 15000 },
  { text: "Hop in the music and rock your body right", time: 18000 },
  { text: "Rock that body, come on, come on, rock that body (rock your body)", time: 21000 },
  { text: "Rock that body, come on, come on, rock that body", time: 24000 },
  { text: "Rock that body, come on, come on, rock that body (rock your body)", time: 27000 },
  { text: "Rock that body, come on, come on, rock that body", time: 30000 },
];

const lyricDiv = document.getElementById("lyrics");
const btn = document.getElementById("startBtn");
let timers = [];

function playLyrics() {
  btn.style.display = "none";
  document.body.classList.add("animate");
  lyricDiv.textContent = "";

  lyrics.forEach((line, index) => {
    const timer = setTimeout(() => {
      lyricDiv.style.opacity = 0;
      lyricDiv.style.transform = "scale(0.9)";
      setTimeout(() => {
        lyricDiv.textContent = line.text;
        lyricDiv.style.opacity = 1;
        lyricDiv.style.transform = "scale(1)";
      }, 100);
    }, line.time);
    timers.push(timer);
  });

  // End animation
  const endTimer = setTimeout(() => {
    lyricDiv.textContent = "🎶 The End 🎶";
    document.body.classList.remove("animate");
    btn.style.display = "block";
    timers = [];
  }, lyrics[lyrics.length - 1].time + 4000);
  timers.push(endTimer);
}

btn.addEventListener("click", playLyrics);
</script>
</body>
</html>
